[project]
name = "parcelmaster"
version = "0.1.0"
description = "Self-hosted parcel tracking with pluggable carrier modules"
requires-python = ">=3.13"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "apprise==2.2.0",
    "pywebpush==2.5.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parcelmaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
